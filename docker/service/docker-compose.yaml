services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: freem
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - freem_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d freem"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "always"

  redis:
    image: redis:8
    volumes:
      - redis_data:/data
    networks:
      - freem_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "always"

  postgres-migration:
    build:
      context: ../../source
      dockerfile: ./Freem.Domain.Storage.PostgreSQL.Migrations/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: freem
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freem_network
    restart: "no"

  api:
    build:
      context: ../../source
      dockerfile: ./Freem.Api.Public/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-}
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Cors__Origins__0: ${WEB_PUBLIC_URL}
      Postgres__ConnectionString: Host=postgres; Port=5432; UserID=${POSTGRES_USER}; Password=${POSTGRES_PASSWORD}; Database=freem
      Redis__ConnectionString: redis:6379
      Integrations__EgoHubClient__Address: ${EGOHUB_INTEGRATION_URL}
      Integrations__EgoHubApiKey: ${EGOHUB_INTEGRATION_TOKEN}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      freem_network:
      proxy_network:
        aliases:
          - freem-api
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/_health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "always"

  web:
    build:
      context: ../../source/Freem.Web
      args:
        VITE_API_URL: ${API_PUBLIC_URL}
        VITE_BASE_PATH: ${WEB_BASE_PATH:-/}
    depends_on:
      api:
        condition: service_healthy
    networks:
      freem_network:
      proxy_network:
        aliases:
          - freem-web
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: "always"

  postgres-backup:
    image: postgres:18
    profiles: ["manual"]
    entrypoint: ["sh", "/runner/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/backup.sh:/runner/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freem_network
    restart: "no"

  postgres-restore:
    image: postgres:18
    profiles: ["manual"]
    entrypoint: ["sh", "/runner/restore.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/restore.sh:/runner/restore.sh:ro
      - ./backups:/backups:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freem_network
    restart: "no"

networks:
  freem_network:
    driver: bridge
  proxy_network:
    external: true
    name: ${PROXY_NETWORK_NAME}

volumes:
  postgres_data:
  redis_data:
