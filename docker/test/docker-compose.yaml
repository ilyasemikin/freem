services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: freem_test
    networks:
      - freem_test_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d freem_test"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: "no"

  redis:
    image: redis:8
    networks:
      - freem_test_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: "no"

  postgres-migration:
    build:
      context: ../../source
      dockerfile: ./Freem.Domain.Storage.PostgreSQL.Migrations/Dockerfile
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: "freem_storage_test freem_usecases_test freem_api_test"
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - freem_test_network
    restart: "no"

  api:
    build:
      context: ../../source
      dockerfile: ./Freem.Api.Public/Dockerfile
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      Postgres__ConnectionString: Host=postgres; Port=5432; UserID=test; Password=test; Database=freem_api_test
      Redis__ConnectionString: redis:6379
      # No OpenSearch in the test environment: the sink drops logs it cannot deliver, console output stays
      OpenSearch__Url: http://localhost:9200
      Integrations__EgoHubClient__Address: ${EGOHUB_INTEGRATION_URL:?Set EGOHUB_INTEGRATION_URL in docker/test/.env}
      Integrations__EgoHubApiKey: ${EGOHUB_INTEGRATION_TOKEN:?Set EGOHUB_INTEGRATION_TOKEN in docker/test/.env}
    depends_on:
      postgres-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - freem_test_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/_health/liveness"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: "no"

  test:
    build:
      context: ../../
      dockerfile: ./docker/test/Dockerfile
    depends_on:
      postgres-migration:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    networks:
      - freem_test_network
    restart: "no"

networks:
  freem_test_network:
    driver: bridge
